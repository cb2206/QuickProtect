name: QuickProtect
options:
  minimumXcodeGenVersion: "2.35"
  deploymentTarget:
    macOS: "13.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"
  developmentLanguage: en

settings:
  base:
    PRODUCT_NAME: QuickProtect
    PRODUCT_BUNDLE_IDENTIFIER: com.cb.quickprotect
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: K2LM9FSU6C
  configs:
    # Local dev/test runs on machines without the team's Mac Development cert
    # (the app ships unsigned outside the App Store; releases are cloud-signed
    # via fastlane's ASC key, Release config only), so Debug signs ad-hoc and
    # drops the hardened runtime. Without this, `xcodebuild test` fails at the
    # signing step.
    Debug:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      ENABLE_HARDENED_RUNTIME: NO

schemes:
  QuickProtect:
    build:
      targets:
        QuickProtect: all
        QuickProtectTests: [test]
    test:
      targets:
        - QuickProtectTests

targets:
  QuickProtect:
    type: application
    platform: macOS
    deploymentTarget: "13.0"

    sources:
      - path: QuickProtect
        excludes:
          - "**/*.md"

    info:
      path: QuickProtect/Info.plist
      properties:
        # Menu-bar agent: no Dock icon, no main window.
        LSUIElement: true
        CFBundleIconFile: QuickProtect
        # Marketing version (bump on release). project.yml is the source of truth —
        # `xcodegen generate` writes these into Info.plist, so never hand-edit the plist.
        CFBundleShortVersionString: "1.2.1"
        CFBundleVersion: "4"
        # Required for the Mac App Store.
        LSApplicationCategoryType: public.app-category.utilities
        # Advertise the languages the app ships (English + German) so the system
        # offers German when the user's preferred language is German.
        CFBundleLocalizations:
          - en
          - de
          - fr
          - es
          - nl
          - it
          - pt-BR
        NSHumanReadableCopyright: "Copyright © 2026 Christian Bartels. All rights reserved."
        # Shown when macOS 15+ prompts for local-network access.
        NSLocalNetworkUsageDescription: "QuickProtect connects to your UniFi Protect controller on your local network to list cameras and stream video."
        # Declares only standard/exempt encryption (HTTPS/TLS) is used.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

    entitlements:
      path: QuickProtect/QuickProtect.entitlements
      properties:
        # Required for the Mac App Store.
        com.apple.security.app-sandbox: true
        # Outgoing connections: HTTPS to the controller + RTSP/RTSPS streams.
        com.apple.security.network.client: true
        # Write snapshots to a user-chosen folder (persisted via security-scoped bookmark).
        com.apple.security.files.user-selected.read-write: true

    settings:
      base:
        INFOPLIST_FILE: QuickProtect/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuickProtect/QuickProtect.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework

  QuickProtectTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"

    sources:
      - path: QuickProtectTests
        excludes:
          - "**/*.md"
          - TestRunner.swift
      # Include testable source files directly (no BUNDLE_LOADER needed)
      - path: QuickProtect/Services/RTPParser.swift
      - path: QuickProtect/Services/UpdateAssets.swift
      - path: QuickProtect/Services/HotkeyManager.swift
      - path: QuickProtect/Models/AppSettings.swift
      - path: QuickProtect/Models/Camera.swift
      - path: QuickProtect/Views/AuroraDesign.swift

    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: QuickProtectTests

    dependencies:
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
