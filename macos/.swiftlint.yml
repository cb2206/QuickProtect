# Baseline config for CI (`swiftlint --strict`) and the Claude Code lint hook
# (.claude/settings.json). Rules the code does not yet satisfy are disabled so
# strict mode only blocks on NEW violations; re-enable rules here as the
# corresponding violations get cleaned up.
disabled_rules:
  - colon
  - comma
  - identifier_name
  - implicit_optional_initialization
  - large_tuple
  - multiple_closures_with_trailing_closure
  - nesting
  - non_optional_string_data_conversion
  - opening_brace
  - statement_position
  - todo
  - trailing_comma
  - unused_closure_parameter

# Size rules are on with thresholds just above today's largest offenders
# (CameraGridView.swift / CameraCell, RTSPClient.swift, SettingsView.swift):
# they stop those files growing further, and the review-tracked splits of
# CameraCell and RTSPClient ratchet the numbers down.
file_length:
  warning: 1700
  error: 2000
type_body_length:
  warning: 1400
  error: 1600
function_body_length:
  warning: 120
  error: 200
cyclomatic_complexity:
  warning: 30
  error: 40
line_length:
  warning: 220
  error: 400
  ignores_comments: true
  ignores_urls: true

excluded:
  - build
  - .build
  - tools
