# Baseline config for the Claude Code lint hook (.claude/settings.json).
# Rules the existing code does not yet satisfy are disabled so the hook only
# blocks on NEW violations of the remaining default rules. Re-enable rules
# here as the corresponding violations get cleaned up.
disabled_rules:
  - colon
  - comma
  - cyclomatic_complexity
  - file_length
  - force_cast
  - function_body_length
  - identifier_name
  - implicit_optional_initialization
  - large_tuple
  - line_length
  - multiple_closures_with_trailing_closure
  - nesting
  - non_optional_string_data_conversion
  - opening_brace
  - statement_position
  - todo
  - trailing_comma
  - type_body_length
  - unused_closure_parameter

excluded:
  - build
  - .build
  - graphify-out
  - scripts
