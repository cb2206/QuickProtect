name: macOS build tools
description: >
  Installs pinned XcodeGen and SwiftLint release binaries (verified by SHA-256)
  and selects a fixed Xcode. Brew would hand us whatever version it ships that
  day, and a new SwiftLint default rule or XcodeGen behaviour change would then
  break CI (or a release build) with no change in this repository.
runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      run: |
        # The runner image's default moves; pin so a release is reproducible.
        # Update together with project.yml's xcodeVersion. Available versions:
        # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
        xcode="/Applications/Xcode_16.4.app"
        [ -d "$xcode" ] || { echo "::error::$xcode not on this runner image"; exit 1; }
        sudo xcode-select -s "$xcode"
        xcodebuild -version

    - name: Install XcodeGen 2.46.0
      shell: bash
      run: |
        set -euo pipefail
        url="https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip"
        sha="4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        curl -fsSL -o xcodegen.zip "$url"
        echo "$sha  xcodegen.zip" | shasum -a 256 -c -
        mkdir -p "$HOME/tools/xcodegen" && unzip -q xcodegen.zip -d "$HOME/tools/xcodegen"
        bin="$(find "$HOME/tools/xcodegen" -type f -name xcodegen -path '*/bin/*' | head -1)"
        chmod +x "$bin" && echo "$(dirname "$bin")" >> "$GITHUB_PATH"
        rm xcodegen.zip
        "$bin" --version

    - name: Install SwiftLint 0.65.1
      shell: bash
      run: |
        set -euo pipefail
        url="https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip"
        sha="c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"
        curl -fsSL -o swiftlint.zip "$url"
        echo "$sha  swiftlint.zip" | shasum -a 256 -c -
        mkdir -p "$HOME/tools/swiftlint" && unzip -q swiftlint.zip -d "$HOME/tools/swiftlint"
        chmod +x "$HOME/tools/swiftlint/swiftlint"
        echo "$HOME/tools/swiftlint" >> "$GITHUB_PATH"
        rm swiftlint.zip
        "$HOME/tools/swiftlint/swiftlint" version
