name: release

# Builds the GitHub-release artifacts for a version tag and attaches them to a
# DRAFT release — review and publish it manually. Publishing is the moment the
# in-app update checks (macOS UpdateChecker.swift / .NET UpdateChecker.cs) see
# the version via releases/latest; both only announce once the running
# platform's asset is present, so the asset names below are a de facto API.
#
# Nothing is built until both test suites pass, and only the draft-release job
# can write to the repository. `workflow_dispatch` builds the same artifacts
# from any branch without creating a release, so changes to this workflow (or
# to the packaging scripts) can be exercised before tagging.
#
# Store builds are separate: Mac App Store via fastlane (macos/fastlane/),
# Microsoft Store via dotnet/scripts/package-msix.ps1 + Partner Center.
#
# The macOS DMG is Developer ID-signed and notarized when the signing secrets
# are configured, ad-hoc signed otherwise — docs/RELEASING.md has the setup.
#
# Actions are pinned to commit SHAs (Dependabot keeps them current); the
# version comment is for humans.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # The tag is the release version; fail fast if the sources disagree with it.
  # (Skipped for manual dry runs, which build whatever the branch says.)
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag matches project.yml and Directory.Build.props
        if: github.ref_type == 'tag'
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mac="$(sed -n 's/.*CFBundleShortVersionString: "\([^"]*\)".*/\1/p' macos/project.yml)"
          net="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' dotnet/Directory.Build.props)"
          echo "tag=$ver macos=$mac dotnet=$net"
          [ "$ver" = "$mac" ] && [ "$ver" = "$net" ] || {
            echo "::error::Version mismatch — bump macos/project.yml and dotnet/Directory.Build.props to $ver before tagging."
            exit 1
          }

  test-macos:
    needs: check-version
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/macos-tools
      - name: Test and lint
        working-directory: macos
        run: |
          xcodegen generate
          git diff --exit-code -- QuickProtect/Info.plist
          xcodebuild test -scheme QuickProtect -destination 'platform=macOS' -quiet
          swiftlint lint --strict

  test-dotnet:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Restore (locked), format check, test
        working-directory: dotnet
        run: |
          dotnet restore QuickProtect.sln --locked-mode
          dotnet format QuickProtect.sln --no-restore --verify-no-changes
          dotnet test QuickProtect.sln --no-restore

  macos-dmg:
    needs: test-macos
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Developer ID signing + notarization switch on by themselves once the
      # secrets exist (docs/RELEASING.md walks through creating them). Until
      # then the DMG is ad-hoc signed, exactly as before.
      NOTARIZE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/macos-tools

      # A throwaway keychain holds the Developer ID certificate for this job
      # only; it is deleted in the last step whatever happens.
      - name: Import Developer ID certificate
        if: env.NOTARIZE == 'true'
        id: cert
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw="$(openssl rand -hex 24)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Let codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pw" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "::error::No 'Developer ID Application' identity in MACOS_CERTIFICATE_P12"; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      # The unsigned GitHub build (see UpdateChecker.swift's AppDistribution
      # note) — ad-hoc signing, same overrides as Debug in project.yml.
      # Release config keeps ONLY_ACTIVE_ARCH=NO → universal.
      - name: Build Release (ad-hoc signed)
        if: env.NOTARIZE != 'true'
        working-directory: macos
        run: |
          xcodegen generate
          xcodebuild -project QuickProtect.xcodeproj -scheme QuickProtect \
            -configuration Release -destination 'platform=macOS' SYMROOT=build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO build -quiet
          lipo -info build/Release/QuickProtect.app/Contents/MacOS/QuickProtect

      # Developer ID build: hardened runtime and a secure timestamp are what
      # notarization checks for; the sandbox entitlements stay as they are.
      - name: Build Release (Developer ID signed)
        if: env.NOTARIZE == 'true'
        working-directory: macos
        run: |
          xcodegen generate
          xcodebuild -project QuickProtect.xcodeproj -scheme QuickProtect \
            -configuration Release -destination 'platform=macOS' SYMROOT=build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ steps.cert.outputs.identity }}" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            ENABLE_HARDENED_RUNTIME=YES build -quiet
          lipo -info build/Release/QuickProtect.app/Contents/MacOS/QuickProtect
          codesign --verify --deep --strict --verbose=2 build/Release/QuickProtect.app

      - name: Package DMG
        working-directory: macos
        run: |
          # Version from the source of truth, so dry runs from a branch work too.
          ver="$(sed -n 's/.*CFBundleShortVersionString: "\([^"]*\)".*/\1/p' project.yml)"
          staging=$(mktemp -d)
          cp -R build/Release/QuickProtect.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname QuickProtect -srcfolder "$staging" \
            -ov -format UDZO "QuickProtect-$ver.dmg"

      # Sign the disk image itself, submit it to Apple, staple the ticket so
      # Gatekeeper passes it offline, then prove that with the same check
      # Gatekeeper runs.
      - name: Notarize and staple
        if: env.NOTARIZE == 'true'
        working-directory: macos
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          dmg="$(ls QuickProtect-*.dmg)"
          key="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$key"
          codesign --sign "${{ steps.cert.outputs.identity }}" --timestamp "$dmg"
          if ! xcrun notarytool submit "$dmg" --key "$key" --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" --wait --timeout 30m --output-format json \
              | tee "$RUNNER_TEMP/notary.json" | grep -q '"status": *"Accepted"'; then
            id="$(sed -n 's/.*"id": *"\([^"]*\)".*/\1/p' "$RUNNER_TEMP/notary.json" | head -1)"
            [ -z "$id" ] || xcrun notarytool log "$id" --key "$key" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            echo "::error::Notarization was not accepted — see the log above"
            exit 1
          fi
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-dmg
          path: macos/QuickProtect-*.dmg
          if-no-files-found: error

      - name: Remove signing keychain and key
        if: always() && env.NOTARIZE == 'true'
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
          kc="${{ steps.cert.outputs.keychain }}"
          [ -z "$kc" ] || security delete-keychain "$kc" || true

  windows-installer:
    needs: test-dotnet
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      # Pinned: the installer compiler version is part of what a release is.
      - name: Install Inno Setup 6.7.1
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - name: Build installer
        run: powershell -File dotnet/scripts/package-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: dotnet/dist/QuickProtect-Setup-*-win-x64.exe
          if-no-files-found: error

  linux-tarball:
    needs: test-dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Build tarball
        run: dotnet/scripts/package-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-tarball
          path: dotnet/dist/QuickProtect-*-linux-x64.tar.gz
          if-no-files-found: error

  # The only job that writes to the repository, and only for a tag push.
  draft-release:
    if: github.ref_type == 'tag'
    needs: [macos-dmg, windows-installer, linux-tarball]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - name: Checksums
        run: |
          sha256sum QuickProtect-*.dmg QuickProtect-Setup-*.exe QuickProtect-*.tar.gz | tee SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft --generate-notes \
            --title "QuickProtect ${GITHUB_REF_NAME#v}" \
            QuickProtect-*.dmg QuickProtect-Setup-*.exe QuickProtect-*.tar.gz SHA256SUMS
