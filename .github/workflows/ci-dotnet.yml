name: dotnet

on:
  push:
    branches: [main, dev, "feat/**"]
    paths:
      - "dotnet/**"
      - ".github/workflows/ci-dotnet.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - ".github/workflows/ci-dotnet.yml"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Builds the whole solution (App included — the FFmpeg natives are only
      # needed at runtime, so nothing to fetch here) and runs the Core tests.
      - name: Build and test
        working-directory: dotnet
        run: dotnet test QuickProtect.sln
